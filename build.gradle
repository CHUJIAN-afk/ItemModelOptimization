buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'first.itemmodeloptimization'
base.archivesName = 'item_model_optimization'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run-forge')
            mods {
                item_model_optimization { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'item_model_optimization.refmap.json'
    config 'item_model_optimization.mixins.json'
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from 'LICENSE' }
tasks.named('jar', Jar) {
    archiveClassifier = ''
    manifest.attributes('MixinConfigs': 'item_model_optimization.mixins.json')
    finalizedBy 'reobfJar'
}
